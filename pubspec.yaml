name: checksheet
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  intl: ^0.19.0
  flutter:
    sdk: flutter
  excel: ^4.0.6
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  permission_handler: ^11.3.1
  path: ^1.9.0
  file_picker: ^8.1.7
  mobile_scanner: ^5.1.0
  # PDF 뷰어 (v1.3.5: image/archive 의존성 없음 → excel archive 충돌 없음)
  pdfrx: ^1.3.5
  syncfusion_flutter_pdfviewer: ^28.2.3

dev_dependencies:
  intl: ^0.19.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "checksheet.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

