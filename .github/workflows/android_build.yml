name: Flutter Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.2
          channel: stable

      # Secrets에 KEYSTORE_BASE64가 있으면 복원, 없으면 최초 1회 생성
      - name: Restore or Generate Keystore
        id: keystore
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_PATH"
            echo "Keystore restored from GitHub Secrets"
          else
            echo "Generating new keystore..."
            keytool -genkey -v \
              -keystore "$KEYSTORE_PATH" \
              -alias checksheet \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -dname "CN=CheckSheet,OU=App,O=CheckSheet,L=Seoul,S=Seoul,C=KR" \
              -storepass checksheet1234 \
              -keypass checksheet1234
            echo ""
            echo "==========================================="
            echo " [필수] 아래 4가지를 GitHub Secrets에 등록하세요"
            echo " Settings -> Secrets -> Actions -> New repository secret"
            echo "==========================================="
            echo "Secret: KEYSTORE_BASE64"
            base64 -w 0 "$KEYSTORE_PATH"
            echo ""
            echo "Secret: KEY_ALIAS = checksheet"
            echo "Secret: KEY_PASSWORD = checksheet1234"
            echo "Secret: STORE_PASSWORD = checksheet1234"
            echo "==========================================="
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> $GITHUB_ENV

      - name: Build APK (Release)
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'checksheet' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'checksheet1234' }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'checksheet1234' }}
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/checksheet.apk

      - name: Create Tag
        id: create_tag
        run: |
          TAG_NAME="v$(date +%Y%m%d%H%M%S)"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          git tag $TAG_NAME
          git push origin $TAG_NAME

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.create_tag.outputs.tag }}
          name: Release ${{ steps.create_tag.outputs.tag }}
          files: build/app/outputs/flutter-apk/checksheet.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: checksheet-APK
          path: build/app/outputs/flutter-apk/checksheet.apk
